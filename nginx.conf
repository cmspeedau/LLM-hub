server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web GUI (static). SPA fallback so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the model server. This avoids CORS entirely and,
    # crucially, keeps /api/pull progress streaming unbuffered.
    location /ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web GUI (static). SPA fallback so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Engine (llama.cpp server): OpenAI-compatible API.
    location /llama/ {
        proxy_pass http://llama:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # Runner: downloads, model listing, active-model switching.
    # proxy_buffering off so download progress streams to the GUI in real time.
    location /downloader/ {
        proxy_pass http://runner:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}

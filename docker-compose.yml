name: llm-hub

services:
  # ---------------------------------------------------------------------------
  # Model engine: llama.cpp server (what LM Studio runs under the hood).
  # Serves an OpenAI-compatible API on :8080 and loads one .gguf file from the
  # models volume. The `runner` sidecar picks which file via /models/.active.
  # ---------------------------------------------------------------------------
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llm-hub-llama
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-8081}:8080"
    volumes:
      - models:/models
    environment:
      LLAMA_CTX_SIZE: "${LLAMA_CTX_SIZE:-8192}"
      LLAMA_CACHE_TYPE_K: "${LLAMA_CACHE_TYPE_K:-q8_0}"
      LLAMA_FLASH_ATTN: "${LLAMA_FLASH_ATTN:-1}"
      LLAMA_N_GPU_LAYERS: "${LLAMA_N_GPU_LAYERS:--1}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Supervisor loop: watch /models/.active and (re)start llama-server
        # whenever the selected model changes. Uses only long-stable flags.
        while true; do
          M=$(cat /models/.active 2>/dev/null || true)
          if [ -n "$$M" ] && [ -f "/models/$$M" ]; then
            echo "[llm-hub] serving /models/$$M"
            FA=""; [ "$LLAMA_FLASH_ATTN" = "1" ] && FA="-fa"
            /app/llama-server \
              -m "/models/$$M" \
              --host 0.0.0.0 --port 8080 \
              -c "$$LLAMA_CTX_SIZE" \
              --cache-type-k "$$LLAMA_CACHE_TYPE_K" \
              -ngl "$$LLAMA_N_GPU_LAYERS" \
              $$FA \
              --parallel 1
            echo "[llm-hub] server exited, restarting in 2s"
          fi
          sleep 2
        done
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Runner: the LM Studio piece Ollama gives you for free. Downloads raw .gguf
  # files straight from Hugging Face into /models (with streaming progress),
  # lists and deletes them, and switches the active model by rewriting
  # /models/.active -- the supervisor above picks it up within 2 seconds.
  # ---------------------------------------------------------------------------
  runner:
    image: node:22-alpine
    container_name: llm-hub-runner
    restart: unless-stopped
    working_dir: /srv
    command: node index.js
    volumes:
      - models:/models
      - ./downloader:/srv:ro
    environment:
      MODELS_DIR: /models
      PORT: "3000"

  # ---------------------------------------------------------------------------
  # Web GUI. Static model browser; nginx proxies /llama/ to the engine and
  # /downloader/ to the runner so the browser is always same-origin.
  # ---------------------------------------------------------------------------
  webgui:
    image: nginx:alpine
    container_name: llm-hub-webgui
    restart: unless-stopped
    ports:
      - "${WEBGUI_PORT:-8080}:80"
    volumes:
      - ./webgui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - llama
      - runner

volumes:
  models:
    name: llm-hub-models

name: llm-hub

services:
  # ---------------------------------------------------------------------------
  # Model server. Serves an Ollama HTTP API (and an OpenAI-compatible /v1).
  # Downloads GGUF models straight from Hugging Face, e.g.
  #   ollama pull hf.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: llm-hub-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Let the browser talk to the API directly if you bypass the nginx proxy.
      OLLAMA_ORIGINS: "${OLLAMA_ORIGINS:-*}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-16384}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q8_0}"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Web GUI. Static Hugging Face style model browser + local model library.
  # nginx also reverse-proxies /ollama/ to the service above, so the browser
  # makes same-origin calls and download progress streams unbuffered.
  # ---------------------------------------------------------------------------
  webgui:
    image: nginx:alpine
    container_name: llm-hub-webgui
    restart: unless-stopped
    ports:
      - "${WEBGUI_PORT:-8080}:80"
    volumes:
      - ./webgui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ollama

volumes:
  ollama-models:
    name: llm-hub-models
